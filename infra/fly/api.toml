# Staging API on Fly.io. Deploy from the repo root:
#   fly deploy . --config infra/fly/api.toml
# Secrets (never in this file): see infra/fly/README.md.

app = "repo-sensei-api-staging"
primary_region = "iad"

[build]
  dockerfile = "infra/docker/api.Dockerfile"

[deploy]
  # Runs in a temporary machine from the new image before any new API machine starts;
  # a failed migration aborts the deploy and leaves the running version untouched.
  release_command = "alembic -c packages/core/alembic.ini upgrade head"
  strategy = "rolling"

[env]
  SENSEI_ENV = "staging"
  SENSEI_API_WORKERS = "2"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
