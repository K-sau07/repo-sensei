[project]
name = "sensei-workers"
version = "0.1.0"
description = "Background workers for repo-sensei."
requires-python = ">=3.13"
dependencies = ["sensei-core", "sensei-engine"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei_workers"]
