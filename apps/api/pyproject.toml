[project]
name = "sensei-api"
version = "0.1.0"
description = "HTTP API for repo-sensei."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "httpx>=0.28",
    "opentelemetry-instrumentation-fastapi>=0.57b0",
    "sensei-core",
    "sensei-engine",
    "sse-starlette>=2.2",
    "uuid-utils>=0.11",
    "uvicorn[standard]>=0.37",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei_api"]

[tool.uv.sources]
sensei-engine = { workspace = true }
