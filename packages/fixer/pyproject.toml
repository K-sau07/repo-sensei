[project]
name = "sensei-fixer"
version = "0.1.0"
description = "repo-sensei's fix pipeline: an issue taken from intake to a verified draft pull request."
requires-python = ">=3.13"
dependencies = ["sensei-core", "sensei-engine"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei_fixer"]
