[project]
name = "sensei-engine"
version = "0.1.0"
description = "Code understanding engine: ingestion, parsing, retrieval, graph and agent."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3",
    "charset-normalizer>=3.4",
    "httpx>=0.28",
    "httpx2>=2.0",
    "identify>=2.6",
    "msgpack>=1.1",
    "orjson>=3.11",
    "packaging>=24",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    "redis>=6.2",
    "rustworkx>=0.17",
    "sensei-core",
    "sqlglot>=29",  # SQL statement splitting (chunking); tokenizer_core is 29+
    "tiktoken>=0.12",  # token counts for chunk budgets (cl100k_base)
    # tree-sitter: exact pins, the query files are written against these grammars.
    "tree-sitter==0.25.2",  # 0.26.0 corrupts memory in QueryCursor (Python 3.13)
    "tree-sitter-c==0.24.2",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-php==0.25.1",
    "tree-sitter-python==0.25.0",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-typescript==0.23.2",
    "uuid-utils>=0.11",
    "xxhash>=3.5",
    "zstandard>=0.25",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei_engine"]
