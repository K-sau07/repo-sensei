[project]
name = "sensei-engine"
version = "0.1.0"
description = "Code understanding engine: ingestion, parsing, retrieval, graph and agent."
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer>=3.4",
    "identify>=2.6",
    "packaging>=24",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    "sensei-core",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei_engine"]
