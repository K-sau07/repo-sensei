[project]
name = "sensei-engine"
version = "0.1.0"
description = "Code understanding engine: ingestion, parsing, retrieval, graph and agent."
requires-python = ">=3.13"
dependencies = ["sensei-core"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei_engine"]
