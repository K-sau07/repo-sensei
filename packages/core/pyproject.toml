[project]
name = "sensei-core"
version = "0.1.0"
description = "Shared configuration, logging, database and security for repo-sensei."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "cryptography>=45",
    "opentelemetry-api>=1.36",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
    "opentelemetry-instrumentation-httpx>=0.57b0",
    "opentelemetry-instrumentation-redis>=0.57b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.57b0",
    "opentelemetry-sdk>=1.36",
    "orjson>=3.11",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.15",
    "redis>=6.2",
    "sentry-sdk>=2.35",
    "sqlalchemy[asyncio]>=2.0.43,<2.1",
    "structlog>=25.4",
    "uuid-utils>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei_core"]
