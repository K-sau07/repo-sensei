[project]
name = "sensei-core"
version = "0.1.0"
description = "Shared configuration, logging, database and security for repo-sensei."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "orjson>=3.11",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "redis>=6.2",
    "sqlalchemy[asyncio]>=2.0.43",
    "structlog>=25.4",
    "uuid-utils>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei_core"]
