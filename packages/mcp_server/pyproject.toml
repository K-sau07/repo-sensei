[project]
name = "sensei-mcp"
version = "0.1.0"
description = "repo-sensei's MCP server: search, trace, graph, impact and ask tools for coding agents."
requires-python = ">=3.13"
dependencies = ["httpx>=0.28", "mcp>=2.2,<3"]

[project.scripts]
sensei-mcp = "sensei_mcp.stdio:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei_mcp"]
