name: visual

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "pnpm-lock.yaml", ".github/workflows/visual.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/web/**", "pnpm-lock.yaml", ".github/workflows/visual.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    # Pages against apps/web/e2e/visual.spec.ts-snapshots, in the image (and so the Linux and
    # fonts) they were made in. A pull request's page without a baseline fails (a lost one isn't
    # passed); on main, or run by hand, it gets one, in the artifact to commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "web..."
      - name: Pages at 390, 834 and 1440 px against their baselines
        run: pnpm exec playwright test --project visual --update-snapshots="$UPDATE"
        working-directory: apps/web
        env:
          E2E_VISUAL: "1"
          E2E_PORT: "3199"
          UPDATE: ${{ github.event_name == 'pull_request' && 'none' || 'missing' }}
      - name: Baselines (new ones included)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: apps/web/e2e/visual.spec.ts-snapshots
          if-no-files-found: ignore
      - name: Diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: apps/web/test-results
          if-no-files-found: ignore
