name: e2e

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * *" # nightly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium chromium-headless-shell

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/postgres
          tags: repo-sensei/postgres:18-dev
          load: true
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max
      - name: Start Postgres and Redis
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml --env-file .env up -d --wait postgres redis

      - name: UI against the mock API
        run: pnpm --filter web e2e
      - name: Sign-in and teams against the real API (GitHub OAuth stub)
        run: make e2e-real

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-reports
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
