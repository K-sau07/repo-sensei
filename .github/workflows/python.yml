name: python

on:
  push:
    branches: ["**"]
    paths: &python-paths
      - "apps/api/**"
      - "packages/**"
      - "workers/**"
      - "scripts/**"
      - "infra/**"
      - "pyproject.toml"
      - "uv.lock"
      - "pyrightconfig.json"
      - ".env.example"
      - ".github/workflows/python.yml"
  pull_request:
    paths: *python-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run pyright

      # Postgres with pgvector and pg_textsearch is our own image; build it once and cache it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Postgres image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/postgres
          tags: repo-sensei/postgres:18-dev
          load: true
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max

      - name: Start Postgres and Redis
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml --env-file .env up -d --wait postgres redis

      - name: Migrations go up, all the way down, and up again
        run: |
          uv run alembic -c packages/core/alembic.ini upgrade head
          uv run alembic -c packages/core/alembic.ini downgrade base
          uv run alembic -c packages/core/alembic.ini upgrade head

      - name: Tests (unit and integration)
        run: uv run pytest -m "not e2e" --cov --cov-report=term --cov-report=xml

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          tags: repo-sensei/api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: The image runs as a non-root user and can start the app
        run: |
          test "$(docker run --rm --entrypoint id repo-sensei/api:ci -u)" = "10001"
          docker run --rm --entrypoint python repo-sensei/api:ci -c "import sensei_api.app"
      - name: Build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          tags: repo-sensei/worker:ci
          load: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: The worker image runs as a non-root user and registers its tasks
        run: |
          test "$(docker run --rm --entrypoint id repo-sensei/worker:ci -u)" = "10001"
          docker run --rm -e SENSEI_ENV=test --entrypoint python repo-sensei/worker:ci -c "import sensei_workers.tasks.webhooks; from sensei_workers.app import celery_app; assert 'sensei.webhooks.process_github' in celery_app.tasks"
      - name: No private or local files went into the images
        # Our tests, docs and any .env never ship (third-party packages may bundle their own tests).
        run: |
          for image in repo-sensei/api:ci repo-sensei/worker:ci; do
            docker run --rm --entrypoint sh "$image" -c 'test ! -e /app/docs && test -z "$(find / -xdev -name ".env*" -not -path "/proc/*" 2>/dev/null)" && test -z "$(ls -d /app/.venv/lib/python3.*/site-packages/sensei_*/tests 2>/dev/null)" && test -z "$(find /app -path /app/.venv -prune -o -name "*.py" -path "*/tests/*" -print)"'
          done
