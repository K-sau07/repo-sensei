name: web

on:
  push:
    branches: ["**"]
    paths: &web-paths
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".nvmrc"
      - ".github/workflows/web.yml"
  pull_request:
    paths: *web-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Browsers for the component and story tests
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter web exec playwright install --with-deps chromium chromium-headless-shell

      - name: Format
        run: pnpm fmt:check

      - name: Lint
        run: pnpm --filter web lint

      - name: Types
        run: pnpm --filter web typecheck

      - name: Unit, browser and story tests (with accessibility checks)
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

      - name: Storybook builds
        run: pnpm --filter web storybook:build
