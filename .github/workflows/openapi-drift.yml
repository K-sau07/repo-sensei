name: openapi-drift

# The web client is typed from the API's OpenAPI schema; both generated files are committed.
# This fails when the API changed without regenerating them (`make openapi`).

on:
  push:
    branches: ["**"]
    paths: &paths
      - "apps/api/**"
      - "packages/core/**"
      - "apps/web/src/lib/api/**"
      - "scripts/export_openapi.py"
      - ".github/workflows/openapi-drift.yml"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the schema and client types
        run: |
          uv run python scripts/export_openapi.py
          pnpm --filter web gen:api
      - name: Nothing may change
        run: |
          if ! git diff --exit-code -- apps/web/src/lib/api; then
            echo "::error::The API changed but the client types were not regenerated. Run 'make openapi' and commit."
            exit 1
          fi
